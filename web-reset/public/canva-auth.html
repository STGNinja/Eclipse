<!DOCTYPE html>
<html>

<head>
    <title>Connecting to Eclipse...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        window.onload = function () {
            // Get the query parameters from the URL (e.g., ?code=AUTH_CODE&state=...)
            const params = window.location.search;

            // Construct the Custom Scheme URL for the app
            // Scheme: eclipse
            // Path: /oauth/canva
            const appUrl = "eclipse://oauth/canva" + params;

            // Redirect
            window.location.href = appUrl;

            // Fallback message after a few seconds
            setTimeout(function () {
                document.getElementById('status').innerText = "If the app doesn't open, tap the button below.";
                document.getElementById('manual-btn').style.display = 'block';
            }, 2000);
        };
    </script>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <h1 id="status">Connecting to Eclipse...</h1>
        <p>Please wait while we finish signing you in.</p>
        <a id="manual-btn" href="#" onclick="window.location.href='eclipse://oauth/canva' + window.location.search"
            style="display: none; color: #4facfe; text-decoration: none; margin-top: 20px; border: 1px solid #333; padding: 10px 20px; border-radius: 10px;">Open
            App</a>
    </div>
</body>

</html>
